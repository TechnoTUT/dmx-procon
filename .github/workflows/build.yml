# Build procon-light for macOS, Windows and Linux.
# - push to main / pull request: run the tests and build every platform (to check it still builds)
# - push of a tag starting with "v" (e.g. v0.2.0): also attach the builds to a GitHub Release
#   git tag v0.2.0 && git push origin v0.2.0
# This repository is public, so GitHub-hosted runners are free.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Linux: hidapi reads controllers through hidraw and needs libudev. SDL3 is built from source with cmake
  LINUX_DEPS: build-essential pkg-config cmake libudev-dev

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: cargo test

  mac:
    # One app for Apple Silicon and Intel (lipo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: procon-light-mac
          path: dist/mac/procon-light-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Copy-Item target/release/procon-light.exe procon-light-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: procon-light-windows
          path: procon-light-windows-x86_64.exe

  linux:
    # Built inside Debian 12 (glibc 2.36), so it runs on Debian 12 / Raspberry Pi OS Bookworm / Ubuntu 24.04 and later
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: procon-light-linux-${{ matrix.arch }}
          path: dist/linux/procon-light-linux-${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mac, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
