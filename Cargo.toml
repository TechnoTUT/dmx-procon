[package]
name = "procon-light"
version = "0.1.0"
edition = "2024"
description = "Pro Controller のようなゲームパッドで、dmxctl の照明を OSC で動かす"

[dependencies]
# コントローラー。Pro Controller(USB・Bluetooth)など。ジャイロ・振動も使える。Switch 2 Pro Controller は src/switch2.rs で読む
# SDL3 はソースからビルドして実行ファイルに組み込む(ビルドに cmake が要る)。
sdl3 = { version = "0.22", default-features = false, features = ["build-from-source-static", "hidapi"] }
# ウィンドウ(dmxctl と同じ eframe)
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# SDL3 はコントローラーを読むのにだけ使う。画面・音などは切ってビルドを軽くする(ウィンドウは eframe が出す)
# sdl-unix-console-build: Linux で、X11・Wayland の開発用ライブラリが無くてもビルドできるようにする(SDL では画面を作らないので要らない)
sdl3-sys = { version = "0.7", features = ["no-sdl-audio", "no-sdl-video", "no-sdl-gpu", "no-sdl-render", "no-sdl-camera", "no-sdl-dialog", "no-sdl-tray", "sdl-unix-console-build"] }
serde_json = "1"
ctrlc = "3"
# Switch 2 Pro Controller(USB)。始めの合図を libusb で送り、ボタンなどは HID として読む。
# libusb はソースからビルドして組み込む(動かすPCに入れなくてよい)
rusb = { version = "0.9", features = ["vendored"] }
hidapi = "2"

[profile.release]
opt-level = 3
strip = true
